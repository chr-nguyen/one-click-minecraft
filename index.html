<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>JustDig</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="stat"><label id="timeLabel">TIME</label><span id="time">60.0</span></div>
      <div class="stat center"><label id="scoreLabel">SCORE</label><span id="score">0</span></div>
      <div class="stat right"><label id="bestLabel">BEST</label><span id="best">0</span></div>
      <button id="pauseBtn" aria-label="Pause"><span></span><span></span></button>
    </div>

    <!-- Progress toward the next shovel -->
    <div id="progress"><div id="progLabel"></div><div id="progItems"></div></div>

    <div id="flourish"></div>

    <!-- Held-tool name label (the tool itself is the 3D model in view) -->
    <div id="hotbar">
      <div id="toolName">Hand</div>
    </div>

    <div id="overlay">
      <div id="overlay-inner"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
