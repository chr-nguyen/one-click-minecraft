<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JustDig</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="stat"><label>TIME</label><span id="time">60.0</span></div>
      <div class="stat center"><label>SCORE</label><span id="score">0</span></div>
      <div class="stat right"><label>BEST</label><span id="best">0</span></div>
    </div>

    <div id="flourish"></div>

    <!-- Held-tool name label (the tool itself is the 3D model in view) -->
    <div id="hotbar">
      <div id="toolName">Hand</div>
    </div>

    <div id="overlay">
      <div id="overlay-inner"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
